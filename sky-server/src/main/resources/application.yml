server:
  port: 8080

spring:
  profiles:
    active: dev
  main:
    allow-circular-references: true
  datasource:
    druid:
      driver-class-name: ${sky.datasource.driver-class-name}
      url: jdbc:mysql://${sky.datasource.host}:${sky.datasource.port}/${sky.datasource.database}?serverTimezone=Asia/Shanghai&useUnicode=true&characterEncoding=utf-8&zeroDateTimeBehavior=convertToNull&useSSL=false&allowPublicKeyRetrieval=true
      username: ${sky.datasource.username}
      password: ${sky.datasource.password}
  # Boot 3 起 Redis 的配置前缀从 spring.redis 改成了 spring.data.redis。
  # 不改的话这段配置【不会报错、也不会生效】—— 表现为店铺营业状态读不到、缓存全是新建的。
  data:
    redis:
      host: ${sky.redis.host}
      port: ${sky.redis.port}
      password: ${sky.redis.password}
      database: ${sky.redis.database} # 数据库索引

mybatis:
  #mapper配置文件
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.sky.entity
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true

logging:
  level:
    com:
      sky:
        mapper: debug
        service: info
        controller: info

sky:
  ai:
    # 环境变量优先（SKY_AI_API_KEY）；没有就是空 → 等于没配 key，自动降级
    api-key: ${SKY_AI_API_KEY:}
  jwt:
    # ===== 统一登录配置（三端共用）=====
    # 三端共用一个密钥、一个请求头 token，身份由 token 里的 role claim 区分
    #
    # 密钥的【值不写在这里】：application.yml 是进仓库的，而仓库是公开的 ——
    # 把签名密钥写死在这里，等于把"签发合法 token 的能力"一起发布出去
    # （拿到它的人可以自由伪造任意角色，包括 admin）。
    # 真值放在 application-dev.yml，那个文件被 .gitignore 排除，不会进仓库。
    # 写法和上面的 datasource / redis / wechat 完全一致：这里只留占位符。
    # （profile 文件的优先级高于 application.yml，所以 ${} 能解析到 dev 里的那一份）

    secret-key: ${sky.jwt.secret-key}
    # 过期时间 2 小时（毫秒）
    ttl: 7200000
    # 前端传递令牌的请求头名字
    token-name: token

    # ===== 以下为旧的分端登录配置，已被统一登录取代，保留兼容 =====
    # 设置jwt签名加密时使用的秘钥
    admin-secret-key: itcast
    # 设置jwt过期时间
    admin-ttl: 7200000
    # 设置前端传递过来的令牌名称
    admin-token-name: token

    user-secret-key: itheima
    user-ttl: 7200000
    user-token-name: authentication

  wechat:
    app-id: ${sky.wechat.app-id}
    app-secret: ${sky.wechat.app-secret}

  alioss:
    endpoint: ${sky.alioss.endpoint}
    access-key-id: ${sky.alioss.access-key-id}
    access-key-secret: ${sky.alioss.access-key-secret}
    bucket-name: ${sky.alioss.bucket-name}

  # 【必须是 sky 的直接子节点】—— 缩进到 alioss 下面会变成 sky.alioss.es.* ，
  # 而 EsProperties 的 prefix 是 "sky.es"，那样一个值都读不到（静默失效，不报错）。
  # 真值（uri 等）由 application-dev.yml 提供，这里只留占位符，和其它段写法一致。
  es:
    uri: ${sky.es.uri}
    # 不能写成 ${sky.es.alias}：键名和占位符同名 → 循环占位符
    # （只在 profile 里定义了 uri 时，启动会报 Circular placeholder reference）。
    # 这里给字面默认值，与 EsProperties.alias 的默认值一致；profile 若要改就写 sky.es.alias。
    alias: review
    batch-size: ${sky.es.batch-size}
    connect-timeout-ms: ${sky.es.connect-timeout-ms}
    read-timeout-ms: ${sky.es.read-timeout-ms}

# Knife4j 4.x 的增强模式在这里【必须关掉】—— 这是实测结论，不是图省事：
# 1) Knife4j 4.5.0 传递进来的是 springdoc 2.3.0，与 Spring 6.2 / Boot 3.5 不兼容
#    （NoSuchMethodError: ControllerAdviceBean.<init>），所以根 pom 用 springdoc-openapi-bom 覆盖到 2.8.13；
# 2) 但 Knife4j 自己的 Knife4jOpenApiCustomizer 又按老签名调 SpringDocConfigProperties.getGroupConfigs()
#    （springdoc 2.7 起返回类型从 List 变成 Set）→ enable=true 时 /v3/api-docs 与四个分组文档【全部 500】，
#    而 /doc.html 与 swagger-config 仍是 200，极容易被误判成"文档正常"。
# enable=false 时：/doc.html 正常，/v3/api-docs 与四个分组全部 200（纯 JSON），代价是少了 Knife4j 的界面增强。
knife4j:
  enable: false
  setting:
    # 界面语言：可选值 zh_cn / en_us（对应 knife4j 的 OpenAPILanguageEnums）
    language: zh_cn